
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamingland - Account & Cloud Sync</title>
    <link rel="stylesheet" href="storage/css/index.css">
    <style>
        .custom-star-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            display: inline-block;
            object-fit: contain;
            margin: 0 3px;
        }

        .account-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            text-align: center;
        }

        .account-container h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ffffff 0%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            display: inline-block;
            color: #4da6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .section-title {
            text-align: left;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #8c8c8c;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            text-align: left;
            word-break: break-all;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .input-field:focus {
            outline: none;
            border-color: #4da6ff;
        }

        .account-btn {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            box-sizing: border-box;
            display: block;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
        }

        .account-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="account-container">
        <h1>Cloud Sync ✪</h1>
        <a href="index.html" class="back-link">← back to homepage</a>

        <!-- LOGGED OUT VIEW: Login & Signup Form -->
        <div id="logged-out-section" class="hidden">
            <div class="section-title">Sign In or Create Account</div>
            
            <input type="email" id="auth-email" class="input-field" placeholder="Email address">
            <input type="password" id="auth-password" class="input-field" placeholder="Password">

            <button id="login-btn" class="account-btn">Log In</button>
            <button id="signup-btn" class="account-btn">Create Account</button>
        </div>

        <!-- LOGGED IN VIEW: Profile, Username & Cloud Sync Actions -->
        <div id="logged-in-section" class="hidden">
            <div class="section-title">Logged In As</div>
            <div id="user-status" class="status-box"></div>

            <div class="section-title">Your Username</div>
            <input type="text" id="username-input" class="input-field" placeholder="Enter your username">

            <button id="save-username-btn" class="account-btn">Save Username</button>
            <button id="save-progress-btn" class="account-btn">☁ Save Progress to Cloud</button>
            <button id="load-progress-btn" class="account-btn">🔄 Load Progress from Cloud</button>
            <button id="logout-btn" class="account-btn">Log Out</button>
        </div>
    </div>

    <!-- Firebase SDKs & Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your Firebase configuration (Ensure these match your project keys)
       const firebaseConfig = {
  apiKey: "AIzaSyA1dyRxFsWoDP_IJ1jYg8Cst0TCR_nlPy8",
  authDomain: "gamingland-net.firebaseapp.com",
  projectId: "gamingland-net",
  storageBucket: "gamingland-net.firebasestorage.app",
  messagingSenderId: "511326840492",
  appId: "1:511326840492:web:972797366ebc3c1db46109"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elements
        const loggedOutSection = document.getElementById("logged-out-section");
        const loggedInSection = document.getElementById("logged-in-section");
        const userStatusDiv = document.getElementById("user-status");
        const authEmailInput = document.getElementById("auth-email");
        const authPasswordInput = document.getElementById("auth-password");
        const loginBtn = document.getElementById("login-btn");
        const signupBtn = document.getElementById("signup-btn");

        const usernameInput = document.getElementById("username-input");
        const saveUsernameBtn = document.getElementById("save-username-btn");
        const saveProgressBtn = document.getElementById("save-progress-btn");
        const loadProgressBtn = document.getElementById("load-progress-btn");
        const logoutBtn = document.getElementById("logout-btn");

        let currentUser = null;

        // Monitor Auth State and toggle views dynamically
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loggedOutSection.classList.add("hidden");
                loggedInSection.classList.remove("hidden");
                userStatusDiv.innerHTML = `<b>${user.email}</b>`;
                
                // Fetch saved username from Firestore if it exists
                try {
                    const docRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().username) {
                        usernameInput.value = docSnap.data().username;
                    }
                } catch (error) {
                    console.error("Error loading user data:", error);
                }
            } else {
                currentUser = null;
                loggedInSection.classList.add("hidden");
                loggedOutSection.classList.remove("hidden");
            }
        });

        // Handle Login
        loginBtn.addEventListener("click", async () => {
            const email = authEmailInput.value.trim();
            const password = authPasswordInput.value;
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Logged in successfully!");
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });

        // Handle Signup / Create Account
        signupBtn.addEventListener("click", async () => {
            const email = authEmailInput.value.trim();
            const password = authPasswordInput.value;
            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert("Account created successfully!");
            } catch (error) {
                alert("Registration failed: " + error.message);
            }
        });

        // Save Username
        saveUsernameBtn.addEventListener("click", async () => {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, "users", currentUser.uid), {
                    username: usernameInput.value,
                    email: currentUser.email
                }, { merge: true });
                alert("Username saved successfully!");
            } catch (error) {
                alert("Error saving username: " + error.message);
            }
        });

        // Save Progress to Cloud
        saveProgressBtn.addEventListener("click", async () => {
            if (!currentUser) return;
            try {
                const gameData = localStorage.getItem("gameProgress") || "{}";
                await setDoc(doc(db, "users", currentUser.uid), {
                    progress: JSON.parse(gameData),
                    lastSaved: new Date().toISOString()
                }, { merge: true });
                alert("Progress saved to cloud successfully!");
            } catch (error) {
                alert("Error saving progress: " + error.message);
            }
        });

        // Load Progress from Cloud
        loadProgressBtn.addEventListener("click", async () => {
            if (!currentUser) return;
            try {
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().progress) {
                    localStorage.setItem("gameProgress", JSON.stringify(docSnap.data().progress));
                    alert("Progress loaded from cloud successfully!");
                } else {
                    alert("No cloud save data found.");
                }
            } catch (error) {
                alert("Error loading progress: " + error.message);
            }
        });

        // Log Out
        logoutBtn.addEventListener("click", async () => {
            try {
                await signOut(auth);
                alert("Logged out successfully.");
            } catch (error) {
                alert("Error logging out: " + error.message);
            }
        });
    </script>

    <!-- Universal Star Icon Replacement Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            function replaceStarWithImage(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    if (node.textContent.includes('✪')) {
                        const fragment = document.createDocumentFragment();
                        const parts = node.textContent.split('✪');
                        
                        parts.forEach((part, index) => {
                            if (part) {
                                fragment.appendChild(document.createTextNode(part));
                            }
                            if (index < parts.length - 1) {
                                const img = document.createElement('img');
                                img.src = '/images/icons/star.png';
                                img.className = 'custom-star-icon';
                                img.alt = '★';
                                fragment.appendChild(img);
                            }
                        });
                        
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else {
                    if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                        node.childNodes.forEach(child => replaceStarWithImage(child));
                    }
                }
            }

            replaceStarWithImage(document.body);
        });
    </script>
</body>
</html>
