<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamingland - Account & Cloud Sync</title>
    <link rel="stylesheet" href="storage/css/index.css">
    <style>
        .custom-star-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            display: inline-block;
            object-fit: contain;
            margin: 0 3px;
        }

        .account-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #ffffff;
            text-align: center;
        }

        .account-container h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ffffff 0%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-link {
            display: inline-block;
            color: #4da6ff;
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .section-title {
            text-align: left;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #8c8c8c;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95krem;
            text-align: left;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .input-field:focus {
            outline: none;
            border-color: #4da6ff;
        }

        /* Uniform Full-Width Buttons */
        .account-btn {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            box-sizing: border-box;
            display: block;
            text-align: center;
            margin-bottom: 12px;
            transition: background 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
        }

        .account-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .account-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="account-container">
        <h1>Cloud Sync ✪</h1>
        <a href="index.html" class="back-link">← back to homepage</a>

        <div class="section-title">Logged In As</div>
        <div id="user-status" class="status-box">Loading account status...</div>

        <div class="section-title">Your Username</div>
        <input type="text" id="username-input" class="input-field" placeholder="Enter your username">

        <!-- All action buttons sharing the same color and full width -->
        <button id="save-username-btn" class="account-btn">Save Username</button>
        <button id="save-progress-btn" class="account-btn">☁ Save Progress to Cloud</button>
        <button id="load-progress-btn" class="account-btn">🔄 Load Progress from Cloud</button>
        <button id="logout-btn" class="account-btn">Log Out</button>
    </div>

    <!-- Universal Star Icon Replacement Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            function replaceStarWithImage(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    if (node.textContent.includes('✪')) {
                        const fragment = document.createDocumentFragment();
                        const parts = node.textContent.split('✪');
                        
                        parts.forEach((part, index) => {
                            if (part) {
                                fragment.appendChild(document.createTextNode(part));
                            }
                            if (index < parts.length - 1) {
                                const img = document.createElement('img');
                                img.src = '/images/icons/star.png';
                                img.className = 'custom-star-icon';
                                img.alt = '★';
                                fragment.appendChild(img);
                            }
                        });
                        
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else {
                    if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                        node.childNodes.forEach(child => replaceStarWithImage(child));
                    }
                }
            }

            replaceStarWithImage(document.body);
        });
    </script>
</body>
</html>
