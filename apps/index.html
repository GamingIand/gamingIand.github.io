<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Active Events</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Hexagon Background Elements */
        .hex-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="60" height="104" viewBox="0 0 60 104"><path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z M30 34.64 L60 51.96 L60 86.6 L30 103.92 L0 86.6 L0 51.96 Z" fill="none" stroke="%2300f2fe" stroke-width="1"/></svg>');
            pointer-events: none;
        }

        /* Main Centerpiece Content */
        .content {
            text-align: center;
            z-index: 10;
        }

        /* Central Animated Graphic Hexagon */
        .hex-wrapper {
            position: relative;
            width: 140px;
            height: 160px;
            margin: 0 auto 30px;
        }

        .hexagon {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 242, 254, 0.03);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 2px solid #00f2fe;
            box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s infinite ease-in-out;
        }

        /* Secondary Offset Hexagon for Depth */
        .hexagon-outer {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 160px;
            height: 180px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 1px dashed rgba(79, 70, 229, 0.4);
            animation: rotateHex 20s linear infinite;
        }

        /* Warning Icon inside the Hexagon */
        .alert-icon {
            width: 40px;
            height: 40px;
            stroke: #00f2fe;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px #00f2fe);
        }

        /* Text Styling */
        h1 {
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #00f2fe 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 10px rgba(0, 242, 254, 0.1));
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.6)); }
        }

        @keyframes rotateHex {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Tech Grid Background Pattern -->
    <div class="hex-bg"></div>

    <div class="content">
        <!-- Hexagon Visual Graphic -->
        <div style="position: relative; width: 160px; height: 180px; margin: 0 auto 20px;">
            <div class="hexagon-outer"></div>
            <div class="hex-wrapper">
                <div class="hexagon">
                    <svg class="alert-icon" viewBox="0 0 24 24">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Minimal Text -->
        <h1>No Active Events!</h1>
    </div>

</body>
</html>
