<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0d0f12;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow Effects */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            filter: blur(120px);
            opacity: 0.15;
            z-index: 1;
            border-radius: 50%;
        }

        .orb-1 {
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            bottom: -100px;
            right: -100px;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 650px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 50px;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        h1 span {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Subscription Form */
        .form-group {
            display: flex;
            gap: 0.75rem;
            max-width: 450px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        input[type="email"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 1rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        input[type="email"]::placeholder {
            color: #6b7280;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            outline: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Footer / Socials Placeholder */
        .footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .form-group {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
                gap: 1rem;
            }

            input[type="email"] {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 10px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <div class="badge">Launching Soon</div>
        <h1>Something awesome is <span>in the works.</span></h1>
        <p>We're building something exceptional. Drop your email below to be the first to know when we go live.</p>
        
        <form onsubmit="event.preventDefault(); alert('Thanks for subscribing!');">
            <div class="form-group">
                <input type="email" placeholder="Enter your email address" required>
                <button type="submit">Notify Me</button>
            </div>
        </form>

        <div class="footer">
            &copy; 2026 GAMINGLAND.
        </div>
    </div>

</body>
</html>
