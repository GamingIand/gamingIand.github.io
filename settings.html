        <style>
            :root {
                --bg-color: #0d1117;
                --panel-bg: rgba(22, 27, 34, 0.75);
                --accent-color: #58a6ff;
                --accent-gradient: linear-gradient(135deg, #238636 0%, #2ea043 100%);
                --danger-gradient: linear-gradient(135deg, #da3633 0%, #f85149 100%);
                --text-main: #c9d1d9;
                --text-muted: #8b949e;
                --border-color: rgba(240, 246, 252, 0.12);
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-main);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-x: hidden;
            }

            #content-side {
                background: var(--panel-bg);
                backdrop-filter: blur(12px);
                border: 1px solid var(--border-color);
                border-radius: 24px;
                padding: 40px;
                width: 100%;
                max-width: 650px;
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            h1 {
                margin: 0 0 5px 0;
                font-size: 28px;
                font-weight: 800;
                letter-spacing: -0.5px;
                color: #ffffff;
                background: linear-gradient(135deg, #ffffff 30%, #8b949e 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            h2 {
                font-size: 14px !important;
                font-weight: 700 !important;
                color: var(--text-muted) !important;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                margin: 15px 0 8px 0 !important;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 6px;
            }

            a {
                color: var(--accent-color);
                text-decoration: none;
                transition: color 0.2s;
            }

            a:hover {
                text-decoration: underline;
                color: #79c0ff;
            }

            /* Form Elements Styling */
            select, input[type="text"], input[type="url"] {
                background: rgba(13, 17, 23, 0.6);
                border: 1px solid var(--border-color);
                color: var(--text-main);
                padding: 12px 16px;
                border-radius: 12px;
                font-size: 14px;
                outline: none;
                width: 100%;
                box-sizing: border-box;
                transition: all 0.25s ease;
            }

            select:focus, input[type="text"]:focus, input[type="url"]:focus {
                border-color: var(--accent-color);
                box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
                background: rgba(13, 17, 23, 0.9);
            }

            /* Custom Styled Buttons with Satisfying Press Feel */
            button {
                background: rgba(33, 38, 45, 0.8);
                border: 1px solid var(--border-color);
                color: var(--text-main);
                padding: 10px 18px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                margin: 4px 4px 4px 0;
                position: relative;
                overflow: hidden;
            }

            button:hover {
                transform: translateY(-2px);
                background: rgba(48, 54, 61, 0.9);
                border-color: var(--accent-color);
                color: #ffffff;
                box-shadow: 0 6px 15px rgba(88, 166, 255, 0.15);
            }

            button:active {
                transform: scale(0.96);
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            }

            #saveButton, #apply-theme, #apply-custom-theme {
                background: var(--accent-gradient);
                border: none;
                color: white;
            }

            #saveButton:hover, #apply-theme:hover, #apply-custom-theme:hover {
                opacity: 0.92;
                box-shadow: 0 6px 18px rgba(35, 134, 54, 0.4);
            }

            /* Theme Customization Grid */
            #custom-theme-settings {
                background: rgba(13, 17, 23, 0.4);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                padding: 18px;
                margin-top: 10px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .theme-property {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .theme-property label {
                font-size: 13px;
                color: var(--text-muted);
            }

            .theme-property input[type="text"] {
                flex: 1;
                max-width: 260px;
            }

            input[type="color"] {
                -webkit-appearance: none;
                border: none;
                width: 38px;
                height: 38px;
                border-radius: 8px;
                cursor: pointer;
                background: transparent;
            }

            input[type="color"]::-webkit-color-swatch-wrapper {
                padding: 0;
            }

            input[type="color"]::-webkit-color-swatch {
                border: 1px solid var(--border-color);
                border-radius: 8px;
            }

            /* Radio labels */
            label {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                font-size: 14px;
                color: var(--text-main);
                margin-right: 15px;
            }

            input[type="radio"] {
                accent-color: var(--accent-color);
                width: 16px;
                height: 16px;
            }

            p[id*="success"] {
                background: rgba(35, 134, 54, 0.15);
                border: 1px solid rgba(46, 160, 67, 0.4);
                color: #7ee787;
                padding: 8px 12px;
                border-radius: 8px;
                font-size: 13px;
                margin-top: 6px;
            }

            /* Ripple Effect Element for Click Satisfaction */
            .ripple {
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.35);
                transform: scale(0);
                animation: ripple-effect 0.5s linear;
                pointer-events: none;
            }

            @keyframes ripple-effect {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        </style>

        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/offline-worker.js').then(function(registration) {
                        console.log('service worker initalised! scope:', registration.scope);

                        navigator.serviceWorker.addEventListener('message', function(event) {
                            if (event.data === 'cached') {
                                document.getElementById('cache-status').style.display = 'block';
                            }
                        });
                    }, function(error) {
                        console.log('ack, error with serviceworker! ', error);
                    });
                });
            }

            // Satisfying click ripple particle generator script
            document.addEventListener('DOMContentLoaded', () => {
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const rect = btn.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        const ripple = document.createElement('span');
                        ripple.classList.add('ripple');
                        ripple.style.left = `${x}px`;
                        ripple.style.top = `${y}px`;
                        
                        btn.appendChild(ripple);
                        setTimeout(() => ripple.remove(), 500);
                    });
                });
            });
        </script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    // Function to replace text nodes containing '✪' with an image
    function replaceStarWithImage(node) {
        if (node.nodeType === Node.TEXT_NODE) {
            if (node.textContent.includes('✪')) {
                const fragment = document.createDocumentFragment();
                const parts = node.textContent.split('✪');
                
                parts.forEach((part, index) => {
                    if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                    if (index < parts.length - 1) {
                        const img = document.createElement('img');
                        img.src = 'images/icons/star.png'; // Path to your star image
                        img.className = 'custom-star-icon';
                        img.alt = '★';
                        fragment.appendChild(img);
                    }
                });
                
                node.parentNode.replaceChild(fragment, node);
            }
        } else {
            // Skip script and style tags to avoid breaking code
            if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                node.childNodes.forEach(child => replaceStarWithImage(child));
            }
        }
    }

    // Run across the whole body content
    replaceStarWithImage(document.body);
});
</script>
