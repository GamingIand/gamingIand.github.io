<html lang="en">
    <head>
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-7FN7LEVWXD');
        </script>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/images/ico.ico" type="image/x-icon">
        <link rel="stylesheet" href="/storage/css/index.css">
        <title>Welcome | Gamingland</title>

        <meta name="description" content="an open source games site hosting 500+ games, useful utilities, powerful settings + a clean user interface">
        <meta property="og:site_name" content="gamingland">
        <meta property="og:title" content="gamingland">
        <meta property="og:type" content="website">
        <meta property="og:description" content="an open source games site hosting 500+ games, useful utilities, powerful settings + a clean user interface">

        <!-- Check returning user early to prevent flickers -->
        <script>
            if (localStorage.getItem('gamingland_has_visited') === 'true') {
                window.location.href = 'home.html';
            }
        </script>
        
        <style>
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --accent-color: #ffd700;
                --primary-btn-bg: #ffd700;
                --primary-btn-text: #000000;
                --border-color: rgba(255, 215, 0, 0.35);
                --gold-flash: rgba(255, 200, 55, 0.28);
            }

            /* Apple Intelligence Style Animated Rainbow Edge Border */
            .rainbow-screen-border {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none;
                border: 4px solid transparent;
                border-image: linear-gradient(60deg, #ff2a2a, #ff7f00, #ffe600, #00f2fe, #7f00ff, #ff007f, #ff2a2a) 1;
                z-index: 99999;
                box-sizing: border-box;
                animation: rainbowBorderRotate 8s linear infinite;
            }

            @keyframes rainbowBorderRotate {
                0% {
                    filter: hue-rotate(0deg);
                }
                100% {
                    filter: hue-rotate(360deg);
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow-x: hidden;
                position: relative;
            }

            /* Windows OOBE Style Ambient Gold Flashes */
            .ambient-light {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 70vw;
                height: 70vh;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle, var(--gold-flash) 0%, rgba(255, 180, 0, 0.1) 45%, rgba(0,0,0,0) 70%);
                border-radius: 50%;
                pointer-events: none;
                z-index: 0;
                filter: blur(60px);
                animation: windowsPulse 12s infinite ease-in-out;
            }

            @keyframes windowsPulse {
                0% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.85); }
                30% { opacity: 0.7; transform: translate(-50%, -55%) scale(1.1); }
                50% { opacity: 0.35; transform: translate(-52%, -48%) scale(0.95); }
                75% { opacity: 0.65; transform: translate(-48%, -52%) scale(1.05); }
                100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.85); }
            }

            /* Header */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 24px 40px;
                width: 100%;
                border-bottom: 2px solid rgba(255, 215, 0, 0.3);
                position: relative;
                z-index: 1;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(10px);
            }

            .logo {
                font-size: 32px;
                font-weight: 800;
                letter-spacing: 1.5px;
                color: var(--accent-color);
                text-decoration: none;
                text-transform: uppercase;
                text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            }

            .about-link {
                color: #ffffff;
                text-decoration: none;
                font-size: 20px;
                font-weight: 400;
                transition: opacity 0.2s, color 0.2s;
            }

            .about-link:hover {
                color: var(--accent-color);
                opacity: 0.9;
            }

            /* Hero Center Section */
            .hero-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 20px;
                flex-grow: 1;
                position: relative;
                z-index: 1;
            }

            .future-text {
                font-size: clamp(26px, 4vw, 42px);
                font-weight: 600;
                letter-spacing: 0.5px;
                margin-bottom: 45px;
                color: #ffffff;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            }

            /* Auth Stack Buttons */
            .auth-actions {
                display: flex;
                flex-direction: column;
                gap: 16px;
                width: 100%;
                max-width: 380px;
                margin-bottom: 20px;
            }

            .btn-pill {
                padding: 14px 24px;
                border-radius: 20px;
                font-size: 24px;
                font-weight: 600;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.25s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }

            .btn-outline {
                background: transparent;
                color: var(--accent-color);
                border: 2px solid var(--accent-color);
                box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
            }

            .btn-outline:hover {
                background: rgba(255, 215, 0, 0.1);
                border-color: #ffea75;
                color: #ffea75;
                transform: scale(1.02);
                box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
            }

            .btn-filled {
                background-color: var(--primary-btn-bg);
                color: var(--primary-btn-text);
                border: 2px solid var(--primary-btn-bg);
                box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            }

            .btn-filled:hover {
                background-color: #ffea75;
                border-color: #ffea75;
                transform: scale(1.02);
                box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
            }

            /* Skip / Guest Link */
            .skip-container {
                margin-top: 5px;
            }

            .skip-link {
                color: #a0a0b0;
                text-decoration: none;
                font-size: 18px;
                font-weight: 400;
                letter-spacing: 0.5px;
                transition: opacity 0.2s, color 0.2s;
            }

            .skip-link:hover {
                color: var(--accent-color);
                opacity: 1;
                text-decoration: underline;
            }

            /* Footer */
            footer {
                text-align: center;
                padding: 16px;
                color: #666666;
                font-size: 13px;
                position: relative;
                z-index: 1;
            }
        </style>
    </head>
    <body>

        <!-- Screen Rainbow Border -->
        <div class="rainbow-screen-border" aria-hidden="true"></div>

        <!-- Ambient Gold Flash BG -->
        <div class="ambient-light"></div>

        <!-- Header -->
        <header>
            <a href="index.html" class="logo">gamingland!</a>
            <a href="about.html" class="about-link">About?</a>
        </header>

        <!-- Main Hero Section -->
        <main class="hero-container">
            <h1 class="future-text">The future of free browser gaming</h1>
            
            <div class="auth-actions">
                <a href="account.html" class="btn-pill btn-outline">Sign in</a>
                <a href="account.html" class="btn-pill btn-filled">Sign up</a>
            </div>

            <div class="skip-container">
                <a href="home.html" id="guest-btn" class="skip-link">use as guest</a>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            &copy; 2026 Gamingland. All rights reserved.
        </footer>

        <!-- Firebase & Auto-Redirect Script -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyA1dyRxFsWoDP_IJ1jYg8Cst0TCR_nlPy8",
                authDomain: "gamingland-net.firebaseapp.com",
                projectId: "gamingland-net",
                storageBucket: "gamingland-net.firebasestorage.app",
                messagingSenderId: "511326840492",
                appId: "1:511326840492:web:972797366ebc3c1db46109"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            // Mark session & redirect to home when clicking guest
            document.getElementById('guest-btn').addEventListener('click', () => {
                localStorage.setItem('gamingland_has_visited', 'true');
            });

            // Automatically redirect to home.html if an active account session is detected
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    localStorage.setItem('gamingland_has_visited', 'true');
                    window.location.href = 'games/index.html';
                }
            });
        </script>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/offline-worker.js').then(function(registration) {
                        console.log('service worker initialized! scope:', registration.scope);
                    }, function(error) {
                        console.log('service worker error!', error);
                    });
                });
            }
        </script>

        <script src="storage/js/cloak.js"></script>
        <script src="storage/js/theme.js"></script>
        <script src="storage/js/cookie.js"></script>
    </body>
</html>
