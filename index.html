<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/images/ico.ico" type="image/x-icon">
        <link rel="stylesheet" href="/storage/css/index.css">
        <title>Welcome | Gamingland</title>

        <meta name="description" content="an open source games site hosting 500+ games, useful utilities, powerful settings + a clean user interface">
        <meta property="og:site_name" content="gamingland">
        <meta property="og:title" content="gamingland">
        <meta property="og:type" content="website">
        <meta property="og:description" content="an open source games site hosting 500+ games, useful utilities, powerful settings + a clean user interface">
        
        <style>
            :root {
                --bg-color: #0d0e15;
                --card-bg: rgba(20, 20, 30, 0.85);
                --card-border: rgba(0, 242, 254, 0.4);
                --card-glow: rgba(0, 242, 254, 0.4);
                --accent: #00f2fe;
            }

            body {
                background-color: var(--bg-color);
                color: #ffffff;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 0;
                padding: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow-x: hidden;
            }

            /* Header */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 30px 50px;
                width: 100%;
                box-sizing: border-box;
            }

            .logo {
                font-size: 20px;
                font-weight: 800;
                letter-spacing: 2px;
                color: #ffffff;
                text-decoration: none;
                text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
                transition: text-shadow 0.2s;
            }

            .logo:hover {
                text-shadow: 0 0 18px rgba(0, 242, 254, 0.8);
            }

            .about-link {
                color: #a0a0b0;
                text-decoration: none;
                font-size: 15px;
                font-weight: 500;
                transition: color 0.2s, text-shadow 0.2s;
            }

            .about-link:hover {
                color: var(--accent);
                text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
            }

            /* Hero Center Section */
            .hero-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 20px 20px 60px 20px;
                flex-grow: 1;
            }

            .future-text {
                font-size: clamp(28px, 5vw, 48px);
                font-weight: 800;
                letter-spacing: 1px;
                margin: 0 0 40px 0;
                background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            }

            /* Action Buttons Container */
            .auth-actions {
                display: flex;
                gap: 20px;
                margin-bottom: 25px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .btn-sleek {
                padding: 14px 32px;
                border-radius: 12px;
                font-size: 15px;
                font-weight: 700;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.3s ease;
                letter-spacing: 0.5px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn-primary {
                background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
                color: #0d0e15;
                box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
                border: none;
            }

            .btn-primary:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 25px rgba(0, 242, 254, 0.5);
            }

            .btn-secondary {
                background: rgba(20, 20, 30, 0.85);
                color: #ffffff;
                border: 1px solid var(--card-border);
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }

            .btn-secondary:hover {
                transform: translateY(-3px);
                background: rgba(30, 30, 45, 0.95);
                border-color: var(--accent);
                box-shadow: 0 0 20px var(--card-glow);
            }

            /* Skip / No Thanks Link */
            .skip-container {
                margin-top: 10px;
            }

            .skip-link {
                color: #808090;
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                transition: color 0.2s;
            }

            .skip-link:hover {
                color: #ffffff;
                text-decoration: underline;
            }

            /* Footer */
            footer {
                text-align: center;
                padding: 20px;
                color: #606070;
                font-size: 13px;
            }
        </style>
    </head>
    <body>

        <!-- Header -->
        <header>
            <a href="index.html" class="logo">GAMINGLAND</a>
            <a href="about.html" class="about-link">about?</a>
        </header>

        <!-- Main Hero Section -->
        <main class="hero-container">
            <h1 class="future-text">://The Future Of Gaming</h1>
            
            <div class="auth-actions">
                <a href="account.html" class="btn-sleek btn-primary">Sign In</a>
                <a href="account.html" class="btn-sleek btn-secondary">Sign Up</a>
            </div>

            <div class="skip-container">
                <a href="home.html" class="skip-link">no thanks skip</a>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            &copy; 2026 Gamingland. All rights reserved.
        </footer>

        <!-- Firebase & Auto-Redirect Script -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyA1dyRxFsWoDP_IJ1jYg8Cst0TCR_nlPy8",
                authDomain: "gamingland-net.firebaseapp.com",
                projectId: "gamingland-net",
                storageBucket: "gamingland-net.firebasestorage.app",
                messagingSenderId: "511326840492",
                appId: "1:511326840492:web:972797366ebc3c1db46109"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            // Automatically redirect to home.html if an active account session is detected
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.href = 'home.html';
                }
            });
        </script>

        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/offline-worker.js').then(function(registration) {
                        console.log('service worker initialized! scope:', registration.scope);
                    }, function(error) {
                        console.log('service worker error!', error);
                    });
                });
            }
        </script>

        <script src="storage/js/cloak.js"></script>
        <script src="storage/js/theme.js"></script>
        <script src="storage/js/cookie.js"></script>
    </body>
</html>
