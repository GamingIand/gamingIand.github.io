        <style>
            /* Modern Theme Additions (Rectangle Button Style) */
            :root {
                --card-bg: rgba(20, 20, 30, 0.85);
                --card-border: rgba(0, 242, 254, 0.4);
                --card-glow: rgba(0, 242, 254, 0.4);
            }

            body {
                background-color: #0d0e15;
                color: #ffffff;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                margin: 0;
                padding: 0;
            }

            /* Rectangle Button Grid Layout */
            .button-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 20px;
                flex-wrap: wrap;
                margin: 30px 0;
            }

            /* Sleek Rectangle Card Styling */
            .gamesbutton {
                position: relative;
                width: 160px;
                height: 100px;
                background: var(--card-bg);
                border-radius: 12px;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 12px;
                cursor: pointer;
                transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
                border: 1px solid var(--card-border);
                padding: 10px 15px;
                box-sizing: border-box;
            }

            .gamesbutton img {
                width: 32px;
                height: 32px;
                object-fit: contain;
                filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            }

            .gamesbutton a {
                text-decoration: none;
                display: flex;
                align-items: center;
            }

            .button-text p {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #e0e0e0;
            }

            /* Rectangle Hover Glow & Lift */
            .gamesbutton:hover {
                transform: translateY(-4px) scale(1.03);
                background: rgba(30, 30, 45, 0.95);
                border-color: #00f2fe;
                box-shadow: 0 0 20px var(--card-glow);
            }

            /* Blackout & Popup Modernisation */
            #blackout {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(5px);
                z-index: 999;
            }

            #updPopup {
                display: none;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 90%;
                max-width: 600px;
                max-height: 85vh;
                background: #151621;
                border: 1px solid var(--card-border);
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                border-radius: 12px;
                padding: 25px;
                z-index: 1000;
                overflow-y: auto;
                box-sizing: border-box;
            }

            #updConfirm {
                background: #00f2fe;
                color: #0d0e15;
                border: none;
                padding: 10px 25px;
                font-weight: bold;
                border-radius: 6px;
                cursor: pointer;
                transition: background 0.2s;
            }

            #updConfirm:hover {
                background: #4facfe;
            }

            .content-side {

                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-start;
                min-height: 100vh;
                text-align: left;
                padding: 40px;
                box-sizing: border-box;
            }
