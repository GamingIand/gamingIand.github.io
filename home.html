        <style>
            :root {

                font-size: 14px;

                border-radius: 8px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);

                gap: 8px;

            .nav-item:hover {

                border-color: var(--accent);
                background: rgba(0, 242, 254, 0.1);
                box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);

            /* Central Hero Area */

                margin: 0 0 15px 0;
                letter-spacing: 1px;

                -webkit-text-fill-color: transparent;
            }

            .hero-subtitle {
                font-size: 16px;
                color: #a0a0b0;
                margin-bottom: 40px;

            }

            /* Explore Games Call-To-Action Button */
            .explore-btn {

                color: #0d0e15;

        <!-- Topbar Navigation -->
        <header>

                <a href="settings.html" class="nav-item">

        <!-- Main Hero Section -->

            <h1 class="hero-title">Welcome Back</h1>
            <p class="hero-subtitle">Ready to jump into your favorite games and utilities?</p>

            <!-- EXPLORE GAMES Button -->
            <a href="games/index.html" class="explore-btn">
                <img src="images/other/controller.png" alt="Controller">
                EXPLORE GAMES
            </a>
        </main>

        <!-- Firebase Auth & User Dynamic Name Handling -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
            import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

            const firebaseConfig = {
                apiKey: "AIzaSyA1dyRxFsWoDP_IJ1jYg8Cst0TCR_nlPy8",
                authDomain: "gamingland-net.firebaseapp.com",
                projectId: "gamingland-net",
                storageBucket: "gamingland-net.firebasestorage.app",
                messagingSenderId: "511326840492",
                appId: "1:511326840492:web:972797366ebc3c1db46109"
            }; 

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                const accountLink = document.getElementById('account-nav-link');
                
                if (user && accountLink) {
                    let displayName = localStorage.getItem('username');
                    
                    if (!displayName) {
                        try {
                            const docSnap = await getDoc(doc(db, "users", user.uid));
                            if (docSnap.exists() && docSnap.data().username) {
                                displayName = docSnap.data().username;
                                localStorage.setItem('username', displayName);
                            } else {
                                displayName = user.displayName || user.email.split('@')[0];
                            }
                        } catch (e) {
                            displayName = user.email ? user.email.split('@')[0] : "Account";
                        }
                    }

                    accountLink.textContent = `👤 ${displayName}`;
                }
            });
        </script>

        <!-- Service Worker & Utility Scripts -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/offline-worker.js').then(function(registration) {
                        console.log('service worker initialized! scope:', registration.scope);
                    }, function(error) {
                        console.log('service worker error!', error);
                    });
                });
            }
        </script>
