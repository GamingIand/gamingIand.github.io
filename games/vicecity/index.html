<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly happy fun</title>
    <style>
        /* Remove all borders, margins, and scrollbars to ensure true fullscreen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Dark background while loading */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- The iframe embeds the game page and requests permission flags for full functionality -->
    <iframe 
        src="https://sites.google.com/view/drive-u-7-home-10/new-games/gta-cc/zombie-fs" 
        allow="autoplay; fullscreen; keyboard; pointer-lock" 
        allowfullscreen>
    </iframe>

</body>
</html>
