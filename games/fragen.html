<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragen</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <iframe id="game" title="Fragen" allow="fullscreen; autoplay; gamepad" allowfullscreen scrolling="no"></iframe>
  <script>
    // GameDistribution expects the real URL of the page hosting the game as the referrer,
    // so it's filled in automatically from wherever this file is published.
    document.getElementById('game').src =
      'https://html5.gamedistribution.com/626030ce36a249729e19df483d7836dc/' +
      '?gd_sdk_referrer_url=' + encodeURIComponent(location.href);
  </script>
</body>
</html>
